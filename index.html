<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis XV Años - Alexsandra</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #020817;
      font-family: Arial, Helvetica, sans-serif;
    }
    .invitation {
      position: relative;
      width: min(100vw, 560px);
      aspect-ratio: 2250 / 4000;
      overflow: hidden;
      background: #06162e;
      box-shadow: 0 22px 60px rgba(0,0,0,.55);
    }
    .invitation img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Area clicable colocada sobre la bola disco principal */
    .disc-hotspot {
      position: absolute;
      left: 12.5%;
      top: 40.4%;
      width: 64.5%;
      aspect-ratio: 1;
      border-radius: 50%;
      display: block;
      cursor: pointer;
      overflow: hidden;
      transform: rotate(-7deg);
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Reflejos que simulan giro */
    .disc-hotspot::before {
      content: "";
      position: absolute;
      inset: -15%;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg,
          rgba(255,255,255,0) 0deg,
          rgba(255,255,255,.58) 32deg,
          rgba(255,255,255,0) 65deg,
          rgba(30,130,255,.20) 110deg,
          rgba(255,255,255,.70) 155deg,
          rgba(255,255,255,0) 210deg,
          rgba(255,255,255,.35) 270deg,
          rgba(255,255,255,0) 360deg);
      mix-blend-mode: screen;
      opacity: .72;
      animation: discoSpin 2.8s linear infinite;
    }
    .disc-hotspot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 22%, rgba(255,255,255,.85), rgba(255,255,255,0) 12%),
        radial-gradient(circle at 72% 62%, rgba(255,255,255,.65), rgba(255,255,255,0) 10%),
        radial-gradient(circle at 55% 35%, rgba(137,190,255,.45), rgba(137,190,255,0) 18%);
      mix-blend-mode: screen;
      animation: pulse 1.7s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .disc-hotspot:hover,
    .disc-hotspot:focus-visible {
      filter: drop-shadow(0 0 18px rgba(255,255,255,.9));
    }
    .hint {
      position: absolute;
      left: 50%;
      bottom: 4.8%;
      transform: translateX(-50%);
      width: 82%;
      text-align: center;
      color: white;
      font-size: clamp(12px, 2.9vw, 18px);
      letter-spacing: .04em;
      text-shadow: 0 2px 8px rgba(0,0,0,.85);
      pointer-events: none;
      animation: hintGlow 1.5s ease-in-out infinite alternate;
    }
    @keyframes discoSpin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      from { opacity: .38; transform: scale(.98); }
      to { opacity: .95; transform: scale(1.025); }
    }
    @keyframes hintGlow {
      from { opacity: .72; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <main class="invitation" aria-label="Portada interactiva de invitación de XV años de Alexsandra">
    <img src="assets/portada-alexsandra.png" alt="Portada Mis XV Años Alexsandra" />
    <a class="disc-hotspot" href="https://alexsandra.site" target="_blank" rel="noopener" aria-label="Abrir invitación de Alexsandra"></a>
    <div class="hint">Toca la bola disco para ver la invitación</div>
  </main>
</body>
</html>
